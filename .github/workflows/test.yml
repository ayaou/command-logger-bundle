name: Tests and Release

on:
  push:
    branches: [ '*' ]
  pull_request:
    branches: [ '*' ]

permissions:
  contents: write
  issues: write

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        symfony-version: [ '6.4.*', '7.4.*', '8.0.*' ]
        php-version: [ '8.1', '8.2', '8.3', '8.4' , '8.5' ]
        exclude:
          # Symfony 7.x requires PHP 8.2+
          - php-version: '8.1'
            symfony-version: '7.4.*'
          # Symfony 8.x requires PHP 8.4+
          - php-version: '8.1'
            symfony-version: '8.0.*'
          - php-version: '8.2'
            symfony-version: '8.0.*'
          - php-version: '8.3'
            symfony-version: '8.0.*'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: sqlite3, pdo_sqlite
          # Ensure Composer v2 is used
          tools: composer:v2

      - name: Install Dependencies
        run: |
          # 1. Allow flex to run as a plugin globally
          composer global config --no-plugins allow-plugins.symfony/flex true
          
          # 2. Install flex globally (so it works without being in your composer.json)
          composer global require --no-progress --no-scripts --no-plugins symfony/flex

          # 3. Update dependencies with the restriction applied via ENV
          composer update --prefer-dist --no-progress --prefer-stable
        env:
          # Flex reads this environment variable to enforce versions
          SYMFONY_REQUIRE: ${{ matrix.symfony-version }}

      # Optional: Verify the installed version in logs
      - name: Check installed Symfony version
        run: composer show symfony/http-kernel | grep versions

      - name: Run tests
        run: SYMFONY_DEPRECATIONS_HELPER=disabled vendor/bin/phpunit tests -d error_reporting="~E_DEPRECATED & ~E_USER_DEPRECATED"

  release:
    runs-on: ubuntu-latest
    needs: tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Cache Node.js dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-node-
      - name: Install semantic-release
        run: npm install -g semantic-release @semantic-release/git @semantic-release/changelog @semantic-release/github
      - name: Run semantic-release
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
